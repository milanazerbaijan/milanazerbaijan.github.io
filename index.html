<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milan Azərbaycan</title>
<meta name="description" content="Milan haqqında ən son xəbərlər Azərbaycan dilində.">
<meta name="theme-color" content="#c8102e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comments.css">
<script>
  (function(){var t=null;try{t=localStorage.getItem('ma-theme')}catch(e){}
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --red:#c8102e; --red-ink:#a50d26;
  --bg:#f6f4f1; --surface:#ffffff; --ink:#15171a; --ink-2:#4a4f57; --ink-3:#7a808a;
  --line:#e4e0da; --chip:#efebe6; --tag-bg:#fbe7ea; --tag-ink:#a50d26;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f11; --surface:#17191c; --ink:#f1efec; --ink-2:#b9bcc2; --ink-3:#8a8f98;
    --line:#2a2d32; --chip:#22252a; --tag-bg:#3a1219; --tag-ink:#ff8a9a; --red-ink:#ff5a72;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17191c; --ink:#f1efec; --ink-2:#b9bcc2; --ink-3:#8a8f98;
  --line:#2a2d32; --chip:#22252a; --tag-bg:#3a1219; --tag-ink:#ff8a9a; --red-ink:#ff5a72;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.mark{flex:none;height:48px;width:auto;display:block}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand b span{color:var(--red-ink)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-3)}
.iconbtn svg{width:19px;height:19px}
.stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 33%,#111 33% 66%,var(--red) 66%)}

/* filters */
.bar{display:flex;gap:8px;align-items:center;padding:18px 0 6px;flex-wrap:wrap}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px 0 40px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--red)}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list */
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tag-ink);background:var(--tag-bg);padding:3px 8px;border-radius:6px}
.meta{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:22px}
.lead:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.lead h2{font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.025em;margin:14px 0 12px;font-weight:800;text-wrap:balance}
.lead p{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .15s,transform .15s}
.card:hover,.lead:hover{border-color:var(--ink-3)}
.card h3{margin:0;font-size:17.5px;line-height:1.3;letter-spacing:-.01em;font-weight:700;text-wrap:pretty}
.card p{margin:0;color:var(--ink-2);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto}
a.card{text-decoration:none}
a.cl{display:flex;flex-direction:column;gap:10px;text-decoration:none;flex:1;min-width:0}
.lead a.cl{display:block}
.day{grid-column:1/-1;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 2px 0;display:flex;align-items:center;gap:10px}
.day:after{content:"";flex:1;height:1px;background:var(--line)}
.more{display:block;margin:22px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 20px;font-weight:600;cursor:pointer}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}

/* article */
.article{max-width:720px;margin:0 auto;padding:22px 0 40px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--ink-2);padding:8px 0}
.back:hover{color:var(--ink)}
.article h1{font-size:clamp(28px,5vw,42px);line-height:1.12;letter-spacing:-.03em;margin:16px 0 14px;font-weight:800;text-wrap:balance}
.article .lede{font-size:18px;color:var(--ink-2);margin:0 0 22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.body{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.7}
.body p{margin:0 0 1.1em}
.srcbox{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14.5px;color:var(--ink-2)}
.srcbox a{color:var(--red-ink);font-weight:600;word-break:break-word}
.related{margin-top:40px}
.related h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}

footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 calc(26px + env(safe-area-inset-bottom));color:var(--ink-3);font-size:13.5px}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}

@media (max-width:600px){
  .top .wrap{height:58px}
  .brand b{font-size:17px}
  .mark{height:42px;width:auto}
  .lead{padding:20px 18px 20px 22px;border-radius:14px}
  .lead p{font-size:16px}
  .grid{grid-template-columns:1fr;gap:10px}
  .body{font-size:18px}
}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.aside{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px;padding-top:18px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.w h5{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.w h5:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--red)}
.w .sub{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.w .foot{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.4}
.w .foot a{color:var(--ink-3)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:600;color:var(--ink-3);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{width:26px;text-align:center;color:var(--ink-3);font-weight:600;border-left:3px solid transparent}
.tbl tr.z1 td:first-child{border-left-color:#1f8f4e}
.tbl tr.z2 td:first-child{border-left-color:#d08a12}
.tbl tr.z3 td:first-child{border-left-color:var(--red)}
.tbl tr.me td{background:var(--tag-bg);font-weight:800;color:var(--ink)}
.tbl td.pts{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.tgl{margin-top:8px;border:0;background:none;color:var(--red-ink);font-weight:600;font-size:12.5px;cursor:pointer;padding:2px 0}
.pos{display:flex;gap:10px;margin:2px 0 12px}
.pos div{flex:1;background:var(--chip);border-radius:10px;padding:9px 10px}
.pos b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pos span{font-size:11.5px;color:var(--ink-3)}
.fx{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em}
.fx .t{min-width:0;flex:1}
.fx .t b{display:block;font-size:14px}
.fx .t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .d{text-align:right;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.fx .d b{display:block;font-size:13px;color:var(--ink)}
.inj{padding:9px 0;border-bottom:1px solid var(--line)}
.inj:last-child{border-bottom:0}
.inj .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.inj .h small{font-size:10.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.inj .st{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.st.injured{background:var(--tag-bg);color:var(--tag-ink)}
.st.doubt{background:#fff1d6;color:#8a5a00}
.st.suspended{background:var(--chip);color:var(--ink)}
.st.warned{background:#fff8c4;color:#6b5d00}
:root[data-theme="dark"] .st.doubt,:root[data-theme="dark"] .st.warned{background:#3a2e10;color:#ffcf6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st.doubt,:root:not([data-theme="light"]) .st.warned{background:#3a2e10;color:#ffcf6b}}
.inj p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.inj p.r{color:var(--ink-3)}
.inj p.r b{color:var(--ink-2);font-weight:600}

/* stats pill */
.stats{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats[hidden]{display:none}
.stats .dot{width:8px;height:8px;border-radius:50%;background:#22a55a;box-shadow:0 0 0 0 rgba(34,165,90,.5);animation:pulse 2s infinite}
.stats b{color:var(--ink);font-weight:700}
.stats .sep{color:var(--line)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,165,90,.45)}70%{box-shadow:0 0 0 7px rgba(34,165,90,0)}100%{box-shadow:0 0 0 0 rgba(34,165,90,0)}}

/* tabs */
.tabs{display:flex;gap:4px;padding:14px 0 0;max-width:420px}
.tabs a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:9px 0;border-radius:10px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a.mob{display:none}
@media (max-width:979px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .layout .aside{display:none}
  .tabs{max-width:none;padding-top:10px}
  .tabs a.mob{display:block}
  .aside.page{display:flex;position:static;max-height:none;overflow:visible}
}

/* reactions */
.rx{display:none;flex-wrap:wrap;gap:5px}
.rx-on .rx{display:flex}
.rb{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s,transform .1s}
.rb:hover{border-color:var(--ink-3)}
.rb:active{transform:scale(.94)}
.rb .e{font-size:16px;line-height:1}
.rb .n:empty{display:none}
.rb[aria-pressed="true"]{background:var(--tag-bg);border-color:var(--red);color:var(--tag-ink)}
.rb:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.lead .rx{margin-top:16px}
.rxbox{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.rxbox h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:none}
.rx-on .rxbox h4{display:block}

/* about */
.about .body p:last-child{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:18px}
@media (max-width:600px){
  .stats .wide{display:none}
}

.tag{display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:13px;height:13px;flex:none;stroke-width:2.4}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip .ic{width:15px;height:15px;flex:none;opacity:.8}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.tbl td:nth-child(2){max-width:150px}

.tl{flex:none;width:18px;height:18px;object-fit:contain}
.badge.lg{background:var(--chip)}
.badge.lg img{width:28px;height:28px;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Milan Azərbaycan — ana səhifə">
      <img class="mark" src="logo.png" alt="" width="30" height="48">
      <b>Milan <span>Azərbaycan</span></b>
    </a>
    <span class="spacer"></span>
    <div class="stats" id="stats" hidden title="Sayt statistikası"><span class="dot"></span><b id="sOn">0</b><span class="ol">&nbsp;onlayn</span><span class="wide"><span class="sep">&nbsp;|&nbsp;</span>Bu gün <b id="sDay">0</b><span class="sep">&nbsp;|&nbsp;</span>Bu həftə <b id="sWeek">0</b></span></div>
    <button class="acct" id="acctBtn" type="button" hidden></button>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Rejimi dəyiş" title="İşıqlı / qaranlıq rejim"></button>
  </div>
  <div class="stripe"></div>
</header>

<main class="wrap" id="app" aria-live="polite"><div class="empty">Yüklənir…</div></main>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> Milan Azərbaycan · Qeyri-rəsmi azarkeş saytı</span>
    <span id="upd"></span>
  </div>
</footer>

<script src="logos.js"></script>
<script>
(function(){
  var MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';
  var root=document.documentElement, app=document.getElementById('app');
  var DATA=[], W={}, state={kind:'Hamısı',q:'',limit:30};

  function isDark(){var t=root.getAttribute('data-theme');if(t)return t==='dark';return matchMedia('(prefers-color-scheme: dark)').matches}
  function paintBtn(){document.getElementById('themeBtn').innerHTML=isDark()?SUN:MOON}
  document.getElementById('themeBtn').onclick=function(){
    var t=isDark()?'light':'dark';root.setAttribute('data-theme',t);
    try{localStorage.setItem('ma-theme',t)}catch(e){}
    paintBtn();
  };
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintBtn)}catch(e){}
  paintBtn();

    var lede=paras.shift()||'';
    var src=safeUrl(it.sourceUrl);
    var h='<article class="article"><a class="back" href="#/">← Bütün xəbərlər</a><div style="margin-top:14px">'+tag(it.kind)+'</div>';
    h+='<h1>'+esc(it.title)+'</h1><div class="meta" style="margin-bottom:18px">'+esc(full(it.date))+'</div>';
    if(lede)h+='<p class="lede">'+esc(lede).replace(/\n/g,'<br>')+'</p>';
    h+='<div class="body">'+paras.map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'}).join('')+'</div>';
    if(it.source)h+='<div class="srcbox">Əsas mənbə: <strong>'+esc(it.source)+'</strong>'+(src?'<br><a href="'+esc(src)+'" target="_blank" rel="noopener noreferrer">Orijinal məqaləni oxu ↗</a>':'')+'</div>';
    h+='<div class="rxbox"><h4>Bu xəbərə reaksiyanız</h4>'+rxBar(it.id)+'</div>';
    h+='<section class="cmts" id="cmts" data-item="'+esc(it.id)+'" aria-label="Şərhlər"></section>';
    var rel=DATA.filter(function(x){return x.id!==it.id&&x.kind===it.kind}).slice(0,3);
    if(rel.length)h+='<div class="related"><h4>Oxşar xəbərlər</h4><div class="grid">'+rel.map(function(x){return '<a class="card" href="#/xeber/'+encodeURIComponent(x.id)+'"><h3>'+esc(x.title)+'</h3>'+meta(x)+'</a>'}).join('')+'</div></div>';
    h+='</article>';
    app.innerHTML=h;window.scrollTo(0,0);
    rendered();
  }

  var ABOUT=[
    'Salam, Rossonerilər! 🔴⚫',
    'Biz Milanı sevən azərbaycanlı azarkeşlərik. Uzun illərdir klubla bağlı xəbərləri vaxtında tapmaqda və onları öz ana dilimizdə oxumaqda çətinlik çəkirdik. Qrup söhbətlərində vacib xəbərlər tez-tez itib-batırdı, işdən yorğun gələndə isə onları bir-bir axtarmağa nə vaxt, nə də həvəs qalırdı.',
    'Bu sayt məhz buna görə yarandı. Burada Milanla bağlı ən vacib xəbərləri — transferləri, zədələri, mətbuat konfranslarını, müsahibələri və oyun nəticələrini — bir yerə toplayır və Azərbaycan dilində təqdim edirik. Turnir cədvəli, təqvim, zədəli oyunçular və bombardirlər siyahısı da gün ərzində yenilənir.',
    'Xəbərləri rəsmi klub mənbələrindən və etibarlı jurnalistlərdən seçirik. Hər xəbərin altında əsas mənbə göstərilir, şayiələr isə ayrıca "İddia" kimi qeyd olunur.',
    'Bu, qeyri-rəsmi azarkeş saytıdır və AC Milan klubu ilə heç bir rəsmi əlaqəsi yoxdur.',
    'Forza Milan! 🖤❤️'
  ];
  function renderAbout(){
    document.title='Haqqımızda — Milan Azərbaycan';
    app.innerHTML=tabs('h')+'<article class="article about"><h1>Haqqımızda</h1><div class="body">'+ABOUT.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div></article>';
    window.scrollTo(0,0);
  }

  function renderSugg(){
    document.title='Təkliflər və İstəklər — Milan Azərbaycan';
    app.innerHTML=tabs('t')+'<section class="article sgpage" id="sg"><h1>Təkliflər və İstəklər</h1><div class="empty">Yüklənir…</div></section>';
    window.scrollTo(0,0);rendered();
  }

  var listScroll=0;
  function route(){
    var m=location.hash.match(/^#\/xeber\/(.+)$/);
    if(m){renderArticle(decodeURIComponent(m[1]))}
    else if(location.hash==='#/cedvel'){renderTables()}
    else if(location.hash==='#/haqqimizda'){renderAbout()}
    else if(location.hash==='#/teklifler'){renderSugg()}
    else{renderList();window.scrollTo(0,listScroll)}
  }
  document.addEventListener('error',function(e){var im=e.target;if(!im||im.tagName!=='IMG')return;
    if(im.classList.contains('tl')){var w=document.createElement('span');w.innerHTML=dot(im.getAttribute('data-team'));im.replaceWith(w.firstChild)}
    else if(im.hasAttribute('data-short')){var b=im.parentNode;b.classList.remove('lg');b.style.background=im.getAttribute('data-c1');b.style.color=im.getAttribute('data-c2');b.textContent=im.getAttribute('data-short')}
  },true);
  window.addEventListener('hashchange',route);
  app.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#/xeber/"]');if(a&&!/^#\/xeber\//.test(location.hash))listScroll=window.scrollY});

  fetch('data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
    DATA=(d.items||[]).filter(function(x){return x&&x.id&&x.title});
    ['serieA','europaLeague','fixtures','injuries','scorers'].forEach(function(k){W[k]=d[k]||null});
    if(d.generated)document.getElementById('upd').textContent='Yeniləndi: '+full(d.generated);
    route();
  }).catch(function(){app.innerHTML='<div class="empty">Xəbərləri yükləmək alınmadı. Səhifəni yeniləyin.</div>'});
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== Ziyarətçi statistikası (Firebase Realtime Database) =====
   Firebase layihəsi yaradandan sonra aşağıdakı null-u öz konfiqurasiyanızla əvəz edin. */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDhlz79GXffiBuR0_pci5yhOMB1QYqXTuU",
  authDomain: "milanazerbaijan-ce566.firebaseapp.com",
  appId: "1:660585789971:web:d8b88daf797bcca858dde6",
  databaseURL: "https://milanazerbaijan-ce566-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "milanazerbaijan-ce566"
};
(function(){
  if(!FIREBASE_CONFIG||typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database(), box=document.getElementById('stats');
    function bakuDay(ms){var d=new Date(ms+4*3600*1000);return d.toISOString().slice(0,10)}
    var today=bakuDay(Date.now());
    var id=Math.random().toString(36).slice(2,12)+Date.now().toString(36);
    var me=db.ref('presence/'+id);
    db.ref('.info/connected').on('value',function(s){if(s.val()===true){me.onDisconnect().remove();me.set(true)}});
    db.ref('presence').on('value',function(s){document.getElementById('sOn').textContent=s.numChildren();box.hidden=false});
    var seen=null;try{seen=localStorage.getItem('ma-seen')}catch(e){}
    if(seen!==today){
      db.ref('stats/days/'+today).transaction(function(v){return (v||0)+1});
      try{localStorage.setItem('ma-seen',today)}catch(e){}
    }
    /* ===== Reaksiyalar: reactions/<xəbər id>/<ziyarətçi id> = "like" | ... =====
       Hər ziyarətçi hər xəbərə yalnız bir reaksiya verə bilər (eyni düyməyə yenidən basmaq onu geri alır, başqasına basmaq dəyişir). */
    var OK={like:1,dislike:1,love:1,fire:1,wow:1,sad:1};
    var VID=null;try{VID=localStorage.getItem('ma-vid')}catch(e){}
    if(!VID||!/^[a-z0-9]{20}$/.test(VID)){
      var a='abcdefghijklmnopqrstuvwxyz0123456789',r=new Uint8Array(20),v='';
      try{crypto.getRandomValues(r)}catch(e){for(var i=0;i<20;i++)r[i]=Math.floor(Math.random()*256)}
      for(var j=0;j<20;j++)v+=a[r[j]%36];VID=v;
      try{localStorage.setItem('ma-vid',VID)}catch(e){}
    }
    var RX={},MINE={},watched={};
    function idOk(x){return typeof x==='string'&&x.length<=20&&/^[0-9-]+$/.test(x)}
    function paint(id){
      var c=RX[id]||{};
      Array.prototype.forEach.call(document.querySelectorAll('.rx[data-rx="'+id+'"] .rb'),function(b){
        var k=b.getAttribute('data-r');b.querySelector('.n').textContent=c[k]?c[k]:'';
        b.setAttribute('aria-pressed',MINE[id]===k?'true':'false');
      });
    }
    function watch(id){
      if(watched[id]||!idOk(id))return;watched[id]=1;
      db.ref('reactions/'+id).on('value',function(s){
        var c={};s.forEach(function(ch){var v=ch.val();if(OK[v])c[v]=(c[v]||0)+1});
        RX[id]=c;var m=s.child(VID).val();MINE[id]=OK[m]?m:null;
        document.documentElement.classList.add('rx-on');paint(id);
      },function(){});
    }
    function scan(){Array.prototype.forEach.call(document.querySelectorAll('.rx[data-rx]'),function(b){var id=b.getAttribute('data-rx');watch(id);if(RX[id])paint(id)})}
    document.addEventListener('ma:render',scan);scan();
    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('.rx .rb');if(!b)return;
      e.preventDefault();
      var id=b.closest('.rx').getAttribute('data-rx'),k=b.getAttribute('data-r');
      if(!idOk(id)||!OK[k])return;
      var ref=db.ref('reactions/'+id+'/'+VID);
      (MINE[id]===k?ref.remove():ref.set(k)).catch(function(){});
    });

    var weekStart=bakuDay(Date.now()-6*86400000);
    db.ref('stats/days').orderByKey().startAt(weekStart).on('value',function(s){
      var w=0,t=0;s.forEach(function(c){var v=+c.val()||0;w+=v;if(c.key===today)t=v});
      document.getElementById('sDay').textContent=t;document.getElementById('sWeek').textContent=w;box.hidden=false;
    });
  }catch(e){}
})();
</script>
